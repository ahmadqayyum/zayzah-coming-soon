<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zayzah — Visitor statistics</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
@font-face{font-family:"Cormorant Garamond";src:url(../fonts/cormorant-garamond-500-normal.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Jost";src:url(../fonts/jost-400-normal.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Jost";src:url(../fonts/jost-500-normal.ttf) format("truetype");font-weight:500;font-display:swap}
:root{--bg:#fbf5f1;--card:#fff;--line:#eddfd0;--ink:#2f241c;--muted:#7b6c5b;--accent:#8a3550;--soft:#f8e1da;--gold:#b08d4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
h1,h2{margin:0;font-weight:500}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(32px,5vw,44px);line-height:1.1}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
.muted{color:var(--muted);font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px -18px rgba(60,40,20,.3)}
.btn{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;padding:13px 22px;width:100%;font-size:16px}
[hidden]{display:none!important}

/* sign in */
.gate{min-height:100svh;display:grid;place-items:center;padding:20px}
.gate form{width:min(400px,100%);text-align:center}
.gate svg{width:70px;color:var(--gold)}
.gate h1{margin:8px 0 6px;letter-spacing:.24em;font-size:34px}
.gate label{display:block;text-align:left;font-size:13.5px;color:var(--muted);margin-top:16px}
.gate input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.gate input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px rgba(138,53,80,.14)}
.gate .btn{margin-top:22px}
.err{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:#f8e3dd;border:1px solid #dba898;color:#7c2f20;font-size:14.5px}

/* dashboard */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.tile span{display:block;font-size:13.5px;color:var(--muted)}
.tile strong{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:42px;line-height:1.15}
.tile small{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;margin-top:20px}
.wide{margin-top:20px}

/* charts: one colour throughout; the number is always written out, never colour alone */
.cols{display:grid;grid-template-columns:auto 1fr;gap:10px;height:230px;padding-bottom:26px}
.axis{display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:var(--muted);text-align:right}
.bars{display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line);background:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.bar{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;outline:0;min-width:0}
.bar i{display:block;width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--accent);transition:opacity .15s}
.bar:hover i,.bar:focus i{opacity:.65}
.bar em{position:absolute;top:calc(100% + 6px);font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tip{position:absolute;bottom:calc(100% - 28px);z-index:2;padding:5px 9px;border-radius:7px;background:var(--ink);color:#fff;font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.bar:hover .tip,.bar:focus .tip{opacity:1}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rows li{display:grid;grid-template-columns:minmax(96px,40%) 1fr 64px;gap:12px;align-items:center}
.rows .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .t{height:12px}
.rows .t i{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--accent)}
.rows .v{text-align:right;white-space:nowrap}
.rows .v small{color:var(--muted);font-size:12.5px;margin-left:6px}
footer{margin-top:26px}
@media (max-width:560px){.cols{height:190px}.bar em{font-size:10px}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form class="card" id="login" autocomplete="off">
    <svg viewBox="-136 -98 272 224" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3,-6 C30,-95 120,-120 128,-62 C132,-22 70,6 3,4 M3,7 C60,10 100,40 84,78 C70,108 22,84 3,24"/><path d="M-3,-6 C-30,-95 -120,-120 -128,-62 C-132,-22 -70,6 -3,4 M-3,7 C-60,10 -100,40 -84,78 C-70,108 -22,84 -3,24"/><ellipse cx="0" cy="2" rx="4" ry="27" fill="currentColor" stroke="none"/></svg>
    <h1>ZAYZAH</h1>
    <p class="muted">Visitor statistics. Private.</p>
    <label>Username<input id="user" name="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="pass" name="password" type="password" required></label>
    <p class="err" id="login-err" hidden></p>
    <button class="btn main" id="go">Open statistics</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div><h1>Visitor statistics</h1><p class="muted" id="sub">zayzah.com</p></div>
    <div class="actions">
      <span id="periods" class="actions"></span>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="logout">Log out</button>
    </div>
  </div>
  <p class="err" id="err" hidden></p>
  <div class="tiles" id="tiles"></div>
  <div class="card wide"><h2>Visits per day</h2><div id="days"></div></div>
  <div class="card wide"><h2>Time of day (UAE time)</h2><div id="hours"></div></div>
  <div class="grid" id="lists"></div>
  <footer class="muted" id="foot"></footer>
</div>

<script>
/* ---------- how this page is kept private ----------
   This site has no server, so a username and password cannot be "checked" anywhere. Instead, the key that reads the
   statistics is stored below in encrypted form, and the username and password are what unlock it. Without them this
   page contains nothing that can read the numbers. The key can only read statistics; it cannot change anything. */
var VAULT = "eyJzYWx0IjoiZmZ3L3lNRHhtZkxpUWJnWEZGcjVoQT09IiwiaXYiOiJTZkt6Z0dCNEthbTdGbzgwIiwicm91bmRzIjo2MDAwMDAsImRhdGEiOiJBd3NwNW96elVDTmdSdmp1ZkRqNnBuTHZaQzNKc2RRQkU1S1NBcTBuSndCajJacFdSdDY2VHUyekpnTXVTNEEybWhMT2QzQzd5NURyRitBZVVGVXlpQ3p2MUJmUG55YU1mMThPbHRwcWZNdzIxc1JtMmtjNUtuMitmeUxwSlE9PSJ9";

var $ = function (id) { return document.getElementById(id); };
var enc = new TextEncoder(), dec = new TextDecoder();
function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
async function unlock(username, password) {
  var v = JSON.parse(atob(VAULT));
  var material = await crypto.subtle.importKey("raw", enc.encode(username.trim().toLowerCase() + "\n" + password), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(v.salt), iterations: v.rounds, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(v.iv) }, key, bytes(v.data));   // fails when either is wrong
  return JSON.parse(dec.decode(plain));
}

var access = null, days = 30;
var PERIODS = [[7, "7 days"], [30, "30 days"], [90, "90 days"]];
var KEEP = "zayzah_stats_session";   // remembered only until this browser tab is closed

$("login").addEventListener("submit", async function (e) {
  e.preventDefault();
  $("login-err").hidden = true; $("go").disabled = true; $("go").textContent = "Checking…";
  try {
    access = await unlock($("user").value, $("pass").value);
    try { sessionStorage.setItem(KEEP, JSON.stringify(access)); } catch (x) { /* private mode */ }
    $("pass").value = "";
    start();
  } catch (x) {
    $("login-err").textContent = "That username and password don't match."; $("login-err").hidden = false;
  }
  $("go").disabled = false; $("go").textContent = "Open statistics";
});
$("logout").addEventListener("click", function () {
  access = null; try { sessionStorage.removeItem(KEEP); } catch (x) {}
  $("app").hidden = true; $("gate").hidden = false; $("user").focus();
});
$("refresh").addEventListener("click", load);
try { access = JSON.parse(sessionStorage.getItem(KEEP) || "null"); } catch (x) { access = null; }
if (access) start();

function start() {
  $("gate").hidden = true; $("app").hidden = false;
  $("periods").replaceChildren.apply($("periods"), PERIODS.map(function (p) {
    var b = el("button", "btn" + (p[0] === days ? " on" : ""), p[1]);
    b.addEventListener("click", function () { days = p[0]; start(); });
    return b;
  }));
  load();
}

/* ---------- reading the numbers ---------- */
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function api(path, params) {
  var url = "https://" + access.site + ".goatcounter.com/api/v0/" + path + "?" + new URLSearchParams(params);
  for (var attempt = 0; attempt < 4; attempt++) {
    await wait(attempt ? 1500 * attempt : 350);          // GoatCounter allows four requests a second; wait longer after a refusal
    var res;
    try { res = await fetch(url, { headers: { Authorization: "Bearer " + access.token, "Content-Type": "application/json" } }); }
    catch (x) { continue; }                              // asked too quickly, or the connection dropped: try again
    if (res.ok) return res.json();
    if (res.status === 401 || res.status === 403) throw new Error("The statistics key was not accepted. It may have been replaced.");
  }
  throw new Error("The statistics could not be loaded just now. Please try again in a minute.");
}
var DUBAI = "Asia/Dubai";
function dayKey(d) { return new Intl.DateTimeFormat("en-CA", { timeZone: DUBAI }).format(d); }               // 2026-10-11
function dayLabel(key) { return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }).format(new Date(key + "T12:00:00Z")); }
function sourceName(ref) {
  var r = (ref || "").toLowerCase();
  if (!r) return "Direct (typed or saved link)";
  if (r.indexOf("instagram") >= 0 || r === "ig") return "Instagram";
  if (r.indexOf("tiktok") >= 0) return "TikTok";
  if (r.indexOf("facebook") >= 0 || r === "fb" || r.indexOf("fb.com") >= 0 || r.indexOf("fb.me") >= 0) return "Facebook";
  if (r.indexOf("whatsapp") >= 0 || r.indexOf("wa.me") >= 0) return "WhatsApp";
  if (r.indexOf("google") >= 0) return "Google";
  if (r.indexOf("t.co") === 0 || r.indexOf("twitter") >= 0 || r.indexOf("x.com") === 0) return "X (Twitter)";
  return ref;
}
function deviceName(id) { return { phone: "Phones", tablet: "Tablets", desktop: "Computers", desktophd: "Computers" }[id] || "Unknown"; }
function tally(stats, label) {
  var out = {};
  (stats || []).forEach(function (s) { if (s.count > 0) { var k = label(s); out[k] = (out[k] || 0) + s.count; } });
  return Object.keys(out).map(function (k) { return [k, out[k]]; }).sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); });
}

async function load() {
  $("err").hidden = true; $("refresh").disabled = true; $("refresh").textContent = "Loading…";
  try {
    var now = new Date(), keys = [];
    for (var i = days - 1; i >= 0; i--) keys.push(dayKey(new Date(now.getTime() - i * 864e5)));
    var range = { start: new Date(keys[0] + "T00:00:00+04:00").toISOString(), end: now.toISOString() };

    var hits = (await api("stats/hits", Object.assign({ limit: 100 }, range))).hits || [];
    var pages = hits.filter(function (h) { return !h.event; }), events = hits.filter(function (h) { return h.event; });
    var total = await api("stats/total", range);
    var perDay = {}, perHour = new Array(24).fill(0);
    pages.forEach(function (h) {
      (h.stats || []).forEach(function (s) {
        var hourly = s.hourly || [];
        perDay[s.day] = (perDay[s.day] || 0) + (s.daily != null ? s.daily : hourly.reduce(function (a, b) { return a + b; }, 0));
        hourly.forEach(function (n, hr) { perHour[hr] += n; });
      });
    });
    // The lists below are limited to real pages, so a button press is never counted as a visit.
    var only = Object.assign({ limit: 100, include_paths: pages.map(function (h) { return h.path_id; }).join(",") }, range);
    var lists = {};
    if (pages.length) {
      for (var name of ["toprefs", "locations", "sizes", "browsers", "systems", "languages", "campaigns"]) lists[name] = (await api("stats/" + name, only)).stats || [];
    }
    var waiting = null;
    try { waiting = (await (await fetch("https://abacus.jasoncameron.dev/get/zayzah-com/coming-soon-visitors")).json()).value + 10; } catch (x) { /* shown as a dash */ }

    var visits = (total.total || 0) - (total.total_events || 0);
    var follows = tally(events.filter(function (h) { return h.path.indexOf("follow-") === 0; }), function (h) { return sourceName(h.path.slice(7)); });
    var switches = tally(events.filter(function (h) { return h.path.indexOf("switch-to-") === 0; }), function (h) { return h.path === "switch-to-arabic" ? "To Arabic" : "To English"; });
    var followTotal = follows.reduce(function (a, b) { return a + b[1]; }, 0);
    var today = perDay[keys[keys.length - 1]] || 0, yesterday = perDay[keys[keys.length - 2]] || 0;
    var busiest = keys.reduce(function (best, k) { return (perDay[k] || 0) > (perDay[best] || 0) ? k : best; }, keys[0]);

    $("sub").textContent = "zayzah.com · last " + days + " days · a person is counted once every 8 hours";
    $("tiles").replaceChildren(
      tile("Visits, last " + days + " days", visits, "Detailed counting began 7 Oct 2026"),
      tile("Visits today", today, "Yesterday: " + yesterday),
      tile("Busiest day", perDay[busiest] || 0, visits ? dayLabel(busiest) : "No visits yet"),
      tile("“People waiting” on the page", waiting == null ? "–" : waiting, "The number visitors see"),
      tile("Pressed a social button", followTotal, visits ? Math.round(followTotal * 100 / visits) + "% of visits" : ""),
      tile("Switched to Arabic", (switches.find(function (s) { return s[0] === "To Arabic"; }) || [0, 0])[1], "Visitors who pressed the button")
    );
    var step = days <= 7 ? 1 : days <= 30 ? 7 : 14;
    $("days").replaceChildren(columns(keys.map(function (k, i) { return { value: perDay[k] || 0, tip: dayLabel(k), tick: (keys.length - 1 - i) % step === 0 ? dayLabel(k) : "" }; }), "Visits per day"));
    $("hours").replaceChildren(columns(perHour.map(function (n, hr) { return { value: n, tip: hr + ":00 to " + (hr + 1) + ":00", tick: hr % 3 === 0 ? String(hr).padStart(2, "0") + ":00" : "" }; }), "Visits by hour of the day"));
    $("lists").replaceChildren(
      list("Where they came from", tally(lists.toprefs, function (s) { return sourceName(s.name); }), visits),
      list("Countries", tally(lists.locations, function (s) { return s.name || "Unknown"; }), visits),
      list("Phone or computer", tally(lists.sizes, function (s) { return deviceName(s.id); }), visits),
      list("Browsers", tally(lists.browsers, function (s) { return s.name || "Unknown"; }), visits),
      list("Phone and computer systems", tally(lists.systems, function (s) { return s.name || "Unknown"; }), visits),
      list("Visitors' language", tally(lists.languages, function (s) { return s.name === "(unknown)" || !s.name ? "Not reported by the browser" : s.name; }), visits),
      list("Social buttons pressed", follows, followTotal),
      list("Language button", switches, 0),
      list("Campaign links", tally(lists.campaigns, function (s) { return s.name || "Unknown"; }), visits, "None yet. A link such as zayzah.com/?utm_campaign=eid is counted here."),
      list("Pages", tally(pages, function (h) { return h.path === "/" ? "Coming soon page" : h.path; }), visits)
    );
    $("foot").textContent = "Updated " + new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeStyle: "short", timeZone: DUBAI }).format(now) + " (UAE time). No names or personal details are collected. A visit can take a minute or two to appear.";
  } catch (x) {
    $("err").textContent = x.message || "Something went wrong."; $("err").hidden = false;
  }
  $("refresh").disabled = false; $("refresh").textContent = "Refresh";
}

/* ---------- drawing (text is always set as text, never as HTML) ---------- */
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tile(label, value, note) { var t = el("div", "tile"); t.append(el("span", "", label), el("strong", "", String(value)), el("small", "", note || "")); return t; }
function columns(items, label) {
  var peak = Math.max.apply(null, items.map(function (i) { return i.value; }));
  if (!peak) return el("p", "muted", "Nothing recorded in this period yet.");
  var box = el("div", "cols"); box.setAttribute("role", "img"); box.setAttribute("aria-label", label + ". Highest: " + peak + ".");
  var axis = el("div", "axis"); axis.append(el("span", "", String(peak)), el("span", "", "0"));
  var bars = el("div", "bars");
  items.forEach(function (it) {
    var b = el("div", "bar"); b.tabIndex = 0;
    var tip = el("span", "tip"); tip.append(el("b", "", String(it.value)), document.createTextNode(" · " + it.tip));
    var fill = el("i"); fill.style.height = (it.value ? Math.max(3, it.value * 100 / peak) : 0) + "%";
    b.append(tip, fill); if (it.tick) b.append(el("em", "", it.tick));
    bars.append(b);
  });
  box.append(axis, bars); return box;
}
function list(title, rows, whole, empty) {
  var card = el("div", "card"); card.append(el("h2", "", title));
  if (!rows.length) { card.append(el("p", "muted", empty || "Nothing recorded yet.")); return card; }
  var ul = el("ul", "rows"), top = rows[0][1];
  rows.slice(0, 12).forEach(function (r) {
    var li = el("li"); li.title = r[0] + ": " + r[1];
    var track = el("span", "t"), fill = el("i"); fill.style.width = Math.max(2, r[1] * 100 / top) + "%"; track.append(fill);
    var val = el("span", "v", String(r[1])); if (whole) val.append(el("small", "", Math.round(r[1] * 100 / whole) + "%"));
    li.append(el("span", "n", r[0]), track, val); ul.append(li);
  });
  card.append(ul); return card;
}
</script>
</body>
</html>
