<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zayzah — Coming soon</title>
<meta name="description" content="Zayzah — eastern wear for little girls, ages 1 to 8. Launching 1 March 2027.">
<meta name="theme-color" content="#FDFAF4">
<meta property="og:title" content="Zayzah — Coming soon">
<meta property="og:description" content="Eastern wear for little girls, ages 1 to 8. Launching 1 March 2027.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zayzah.com/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/cormorant-garamond-500-normal.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond-500-normal.ttf) format("truetype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond-500-italic.ttf) format("truetype");font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:"Jost";src:url(fonts/jost-400-normal.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Jost";src:url(fonts/jost-500-normal.ttf) format("truetype");font-weight:500;font-style:normal;font-display:swap}

:root{--ivory:#FDFAF4;--linen:#F5EEE2;--beige:#EADFCB;--gold:#B08D4C;--gold-light:#DCC592;--gold-dark:#86652A;--taupe:#6F5D4B;--ink:#2F241C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,var(--ivory) 0%,var(--linen) 70%,var(--beige) 130%) fixed;color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px 32px}

.mark{width:84px;color:var(--gold);animation:float 6s ease-in-out infinite}
.name{margin:18px 0 0;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(34px,9vw,58px);letter-spacing:.34em;margin-right:-.34em;line-height:1.1}
.rule{width:64px;height:1px;background:var(--gold-light);margin:26px auto}
.soon{margin:0;font-size:12px;font-weight:500;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--gold-dark)}
.line{margin:14px 0 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(21px,5vw,28px);line-height:1.3;color:var(--taupe);text-wrap:balance}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.5vw,18px);width:100%;max-width:520px;margin:38px 0 0;padding:0;list-style:none}
.count li{background:rgba(253,250,244,.75);border:1px solid var(--beige);border-radius:4px;padding:18px 4px 14px}
.count b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(32px,9vw,52px);line-height:1;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.count span{display:block;margin-top:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.date{margin:22px 0 0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe)}

.follow{margin:44px 0 0;font-size:14px;color:var(--taupe)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.links a{display:inline-block;padding:11px 20px;border:1px solid var(--gold);border-radius:999px;color:var(--gold-dark);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.04em;transition:background .2s,color .2s}
.links a:hover,.links a:focus-visible{background:var(--gold);color:var(--ivory);outline:none}

footer{padding:20px;text-align:center;font-size:13px;color:var(--taupe)}
footer a{color:var(--gold-dark)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="-136 -98 272 224" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3,-6 C30,-95 120,-120 128,-62 C132,-22 70,6 3,4 M3,7 C60,10 100,40 84,78 C70,108 22,84 3,24"/>
    <path d="M-3,-6 C-30,-95 -120,-120 -128,-62 C-132,-22 -70,6 -3,4 M-3,7 C-60,10 -100,40 -84,78 C-70,108 -22,84 -3,24"/>
    <path d="M-2,-24 C-12,-54 -28,-68 -42,-70 M2,-24 C12,-54 28,-68 42,-70"/>
    <ellipse cx="0" cy="2" rx="4" ry="27" fill="currentColor" stroke="none"/>
  </svg>
  <h1 class="name">ZAYZAH</h1>
  <div class="rule"></div>
  <p class="soon" id="soon">Coming soon</p>
  <p class="line">Eastern wear for little girls, ages 1 to 8</p>

  <ul class="count" id="count" aria-label="Time left until launch">
    <li><b id="d">–</b><span>Days</span></li>
    <li><b id="h">–</b><span>Hours</span></li>
    <li><b id="m">–</b><span>Minutes</span></li>
    <li><b id="s">–</b><span>Seconds</span></li>
  </ul>
  <p class="date" id="date">Launching 1 March 2027</p>

  <p class="follow">Follow us for a first look</p>
  <ul class="links">
    <li><a href="https://www.instagram.com/zayzah.ae" target="_blank" rel="noopener">Instagram</a></li>
    <li><a href="https://www.tiktok.com/@zayzah.ae" target="_blank" rel="noopener">TikTok</a></li>
    <li><a href="https://www.facebook.com/zayzah.ae" target="_blank" rel="noopener">Facebook</a></li>
  </ul>
</main>
<footer>Abu Dhabi, UAE &nbsp;·&nbsp; <a href="mailto:admin@zayzah.com">admin@zayzah.com</a></footer>

<script>
// Launch: midnight at the start of 1 March 2027, UAE time (UTC+4).
var launch = new Date("2027-03-01T00:00:00+04:00").getTime();
var el = {d: document.getElementById("d"), h: document.getElementById("h"), m: document.getElementById("m"), s: document.getElementById("s")};
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function tick() {
  var left = launch - Date.now();
  if (left <= 0) {
    document.getElementById("count").hidden = true;
    document.getElementById("soon").textContent = "We are open";
    document.getElementById("date").textContent = "Launched 1 March 2027";
    clearInterval(timer);
    return;
  }
  var secs = Math.floor(left / 1000);
  el.d.textContent = Math.floor(secs / 86400);
  el.h.textContent = pad(Math.floor(secs % 86400 / 3600));
  el.m.textContent = pad(Math.floor(secs % 3600 / 60));
  el.s.textContent = pad(secs % 60);
}
var timer = setInterval(tick, 1000);
tick();
</script>
</body>
</html>
